    margin:0;
    min-height:100vh;

    letter-spacing:0.02em;
    text-transform:uppercase;
    margin:0;
  }

    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--ember-hot);
  }
  a{color:inherit;text-decoration:none;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px clamp(16px,4vw,48px);
    border-bottom:1px solid rgba(255,122,26,0.15);
  }
  .home-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--panel-edge);
    background:rgba(24,27,31,0.7);
    color:var(--paper);
    font-family:'Oswald',sans-serif;
    font-size:12.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    font-weight:600;
    padding:10px 16px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .home-btn:hover{border-color:var(--ember); color:var(--ember-hot);}
  .topbar .brand{
    font-family:'Teko',sans-serif;
    font-size:22px;
    color:var(--ember-hot);
    letter-spacing:0.04em;
  }

  /* ---------- Shared layout ---------- */
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:36px 18px 70px;
  }
  .page-head{
    text-align:center;
    margin-bottom:30px;
  }
  .page-head .tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid rgba(255,122,26,0.4);
    padding:6px 16px;
    border-radius:2px;
    font-family:'Oswald',sans-serif;
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--ember-hot);
    background:rgba(255,122,26,0.06);
    margin-bottom:14px;
  }
  .page-head .tag::before{
    content:'';
    width:6px;height:6px;background:var(--danger);
    border-radius:50%;
    box-shadow:0 0 8px var(--danger);
  }
  .page-head h1{
    font-size:clamp(30px,7vw,48px);
    line-height:1.0;
    color:var(--paper);
  }
  .page-head h1 .accent{color:var(--ember); text-shadow:0 0 22px rgba(255,122,26,0.4);}

  .step{display:none;}
  .step.active{display:block;}

  .back-btn{
    background:none; border:none; color:var(--steel-light);
    font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.1em;
    text-transform:uppercase; cursor:pointer; padding:0; margin-bottom:20px;
  }
  .back-btn:hover{color:var(--ember);}

  /* ---------- Guild option cards ---------- */
  .guild-options{
    display:flex; flex-direction:column; gap:16px; margin-top:8px;
  }
  .guild-card{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    background:rgba(24,27,31,0.85); border:1px solid var(--panel-edge);
    padding:20px 20px; cursor:pointer; text-align:left;
    transition:all .2s ease;
  }
  .guild-card:hover{border-color:var(--ember); background:rgba(255,122,26,0.06);}
  .guild-card .gc-left{display:flex; flex-direction:column; gap:4px;}
  .guild-card .gc-title{
    font-family:'Teko',sans-serif; font-size:26px; color:var(--paper);
    letter-spacing:0.02em; text-transform:uppercase;
  }
  .guild-card .gc-sub{
    font-family:'Rajdhani',sans-serif; font-size:14px; font-weight:600;
    color:var(--ember-hot);
  }
  .guild-card .gc-right{
    display:flex; flex-direction:column; align-items:flex-end; gap:2px; flex-shrink:0;
  }
  .guild-card .gc-slots{
    font-family:'Teko',sans-serif; font-size:26px; color:var(--ember-hot);
    letter-spacing:0.03em;
  }
  .guild-card .gc-slots-label{
    font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--steel);
  }

  /* ---------- Mode / rules option buttons ---------- */
  .mode-options{
    display:flex; flex-direction:column; gap:12px; margin-top:20px;
  }
  .mode-btn{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--ink2); border:1px solid var(--panel-edge);
    color:var(--paper); font-family:'Rajdhani',sans-serif; font-weight:600;
    font-size:15.5px; padding:16px 18px; cursor:pointer; text-align:left;
    transition:all .2s ease;
  }
  .mode-btn:hover{border-color:var(--ember); color:var(--ember-hot);}
  .mode-btn .arrow{color:var(--ember-hot); font-size:16px;}

  /* ---------- Application form ---------- */
  .app-form{display:flex; flex-direction:column; gap:14px; margin-top:20px;}
  .app-form label{
    font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--steel); margin-bottom:6px; display:block;
  }
  .app-form input[type="text"],
  .app-form input[type="tel"],
  .app-form textarea{
    width:100%; background:var(--ink2); border:1px solid var(--panel-edge);
    color:var(--paper); font-family:'Rajdhani',sans-serif; font-size:15px;
    font-weight:600; padding:10px 12px; box-sizing:border-box;
  }
  .app-form input[type="text"]:focus,
  .app-form input[type="tel"]:focus,
  .app-form textarea:focus{outline:none; border-color:var(--ember);}
  .app-form textarea{resize:vertical; min-height:90px; font-weight:500;}
  .autofill-note{
    font-family:'Oswald',sans-serif; font-size:10.5px; letter-spacing:0.05em;
    color:var(--steel); margin-top:-8px;
  }
  .send-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .send-btn{
    background:var(--ember); color:#1a0a02;
    border:none; padding:13px 22px; font-family:'Oswald',sans-serif;
    font-size:13px; letter-spacing:0.1em; text-transform:uppercase;
    font-weight:600; cursor:pointer;
  }
  .send-btn:hover{background:var(--ember-hot);}
  .send-btn:disabled{opacity:0.6; cursor:default;}
  .sent-msg{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px;
    color:var(--success); display:none;
  }
  .sent-msg.show{display:inline-flex; align-items:center; gap:6px;}

  /* ---------- Qualification rules panel ---------- */
  .qual-panel{
    margin-top:32px; padding:18px 20px; background:rgba(24,27,31,0.85);
    border:1px solid var(--panel-edge); border-left:3px solid var(--ember);
  }
  .qual-panel h4{
    font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--ember-hot); margin-bottom:12px;
    font-weight:600;
  }
  .qual-panel ol{
    margin:0; padding-left:20px; color:var(--steel-light);
    font-size:14.5px; font-weight:600; line-height:1.7;
  }
  .qual-panel .qual-note{
    margin-top:12px; font-size:12.5px; color:var(--steel);
    font-weight:600; line-height:1.5;
  }

  @media (max-width:480px){
    .guild-card{flex-direction:row; padding:16px;}
    .guild-card .gc-title{font-size:22px;}
  }
</style>
</head>
<body>

<div class="bg-wrap"></div>
<div class="bg-fade"></div>

<div class="topbar">
  <button class="home-btn" onclick="window.location.href='index.html'">🏠 Return Home</button>
  <span class="brand">FF ARENA</span>
</div>

<div class="wrap">

  <!-- STEP 1: Guild Selection -->
  <div class="step active" id="step1">
    <div class="page-head">
      <span class="tag">Guilds · Members</span>
      <h1>FF Arena Guild <span class="accent">Members Selection</span></h1>
    </div>

    <div class="guild-options">
      <button class="guild-card" onclick="selectGuild('en')">
        <span class="gc-left">
          <span class="gc-title">Tamil Member Guild</span>
          <span class="gc-sub">தமிழ் மெம்பர் கில்ட்</span>
        </span>
        <span class="gc-right">
          <span class="gc-slots" id="slotsTA">--/50</span>
          <span class="gc-slots-label">Slots Left</span>
        </span>
      </button>

      <button class="guild-card" onclick="selectGuild('hi')">
        <span class="gc-left">
          <span class="gc-title">Hindi Member Guild</span>
          <span class="gc-sub">हिंदी सदस्य गिल्ड</span>
        </span>
        <span class="gc-right">
          <span class="gc-slots" id="slotsHI">--/50</span>
          <span class="gc-slots-label">Slots Left</span>
        </span>
      </button>
    </div>
  </div>

  <!-- STEP 2: Mode / Rules selection -->
  <div class="step" id="step2">
    <button class="back-btn" onclick="goToStep1()" id="backBtn2">← Back</button>
    <div class="page-head">
      <h1 id="step2Heading">Select Your Opinion</h1>
    </div>
    <div class="mode-options" id="modeOptions"></div>

    <div class="qual-panel">
      <h4 id="qualHeading">Player ID Qualification :</h4>
      <ol id="qualList"></ol>
      <p class="qual-note" id="qualNote"></p>
    </div>
  </div>

  <!-- STEP 3: Application / login details -->
  <div class="step" id="step3">
    <button class="back-btn" onclick="goToStep2()" id="backBtn3">← Back</button>
    <div class="page-head">
      <h1 id="step3Heading">Application</h1>
    </div>

    <form class="app-form" id="appForm" onsubmit="return false;">
      <div>
        <label id="lblUid">UID</label>
        <input type="text" id="fieldUid" placeholder="Enter your UID">
      </div>
      <div>
        <label id="lblIdName">ID Name</label>
        <input type="text" id="fieldIdName" placeholder="Enter your ID name">
      </div>
      <div>
        <label id="lblMobile">WhatsApp Number</label>
        <input type="tel" id="fieldMobile" placeholder="Enter your WhatsApp number">
      </div>
      <p class="autofill-note" id="autofillNote"></p>
      <div>
        <label id="lblMsg">Message</label>
        <textarea id="fieldMsg" placeholder="Type your message..."></textarea>
      </div>
      <div class="send-row">
        <button class="send-btn" id="sendBtn" onclick="sendGuildApplication()">Send</button>
        <span class="sent-msg" id="sentMsg">✅ Message received.</span>
      </div>
    </form>
  </div>

</div>

<script>
const guildI18n = {
  en: {
    step2Heading: "Select Your Opinion",
    modes: [
      "1 vs 1 CS Custom — Minimum 5 Rounds Win",
      "1 vs 2 CS Custom — Minimum 4 Rounds Win",
      "1 vs 3 CS Custom — Minimum 3 Rounds Win",
      "1 vs 4 CS Custom — Minimum 2 Rounds Win"
    ],
    back: "← Back",
    lblUid: "UID",
    uidPlaceholder: "Enter your UID",
    lblIdName: "ID Name",
    idNamePlaceholder: "Enter your ID name",
    lblMobile: "WhatsApp Number",
    mobilePlaceholder: "Enter your WhatsApp number",
    lblMsg: "Message",
    msgPlaceholder: "Type your message...",
    send: "Send",
    sentMsg: "✅ Message received. Our guild coordinator will contact you shortly.",
    autofillNote: "UID &amp; ID Name auto-filled from your account — you can edit them manually.",
    qualHeading: "Player ID Qualification :",
    qualRules: [
      "Minimum 30 Level ID",
      "BR Rank minimum Diamond",
      "CS Rank minimum Diamond"
    ],
    qualNote: "Only players who meet all the rules above can join the guild.",
    slotsLabel: "Slots Left"
  },
  hi: {
    step2Heading: "अपना विकल्प चुनें",
    modes: [
      "1 vs 1 CS कस्टम — न्यूनतम 5 राउंड जीत",
      "1 vs 2 CS कस्टम — न्यूनतम 4 राउंड जीत",
      "1 vs 3 CS कस्टम — न्यूनतम 3 राउंड जीत",
      "1 vs 4 CS कस्टम — न्यूनतम 2 राउंड जीत"
    ],
    back: "← वापस",
    lblUid: "यूआईडी",
    uidPlaceholder: "अपना यूआईडी दर्ज करें",
    lblIdName: "आईडी नाम",
    idNamePlaceholder: "अपना आईडी नाम दर्ज करें",
    lblMobile: "व्हाट्सएप नंबर",
    mobilePlaceholder: "अपना व्हाट्सएप नंबर दर्ज करें",
    lblMsg: "मैसेज",
    msgPlaceholder: "अपना मैसेज टाइप करें...",
    send: "भेजें",
    sentMsg: "✅ मैसेज मिल गया। हमारी गिल्ड टीम जल्द ही आपसे संपर्क करेगी।",
    autofillNote: "यूआईडी और आईडी नाम आपके अकाउंट से अपने आप भर गए हैं — आप इन्हें मैनुअल रूप से बदल सकते हैं।",
    qualHeading: "प्लेयर आईडी योग्यता :",
    qualRules: [
      "न्यूनतम लेवल 30 आईडी",
      "BR रैंक न्यूनतम डायमंड",
      "CS रैंक न्यूनतम डायमंड"
    ],
    qualNote: "ऊपर दिए गए सभी नियम पूरे करने वाले खिलाड़ी ही गिल्ड में शामिल हो सकते हैं।",
    slotsLabel: "स्लॉट्स बचे"
  }
};

let currentGuildLang = 'en';
let currentModeIndex = 0;

function randomSlots(){
  return Math.floor(Math.random() * 50) + 1;
}

function initSlots(){
  document.getElementById('slotsTA').textContent = randomSlots() + '/50';
  document.getElementById('slotsHI').textContent = randomSlots() + '/50';
}

function showStep(id){
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectGuild(lang){
  currentGuildLang = lang;
  try{ localStorage.setItem('ffGuildLang', lang); }catch(e){}
  const d = guildI18n[lang];
  document.getElementById('step2Heading').textContent = d.step2Heading;
  document.getElementById('backBtn2').textContent = d.back;

  const wrap = document.getElementById('modeOptions');
  wrap.innerHTML = '';
  d.modes.forEach((label, i) => {
    const btn = document.createElement('button');
    btn.className = 'mode-btn';
    btn.type = 'button';
    btn.onclick = function(){ selectMode(i); };
    btn.innerHTML = '<span>' + label + '</span><span class="arrow">→</span>';
    wrap.appendChild(btn);
  });

  document.getElementById('qualHeading').textContent = d.qualHeading;
  document.getElementById('qualNote').textContent = d.qualNote;
  const qualList = document.getElementById('qualList');
  qualList.innerHTML = '';
  d.qualRules.forEach(r => {
    const li = document.createElement('li');
    li.textContent = r;
    qualList.appendChild(li);
  });

  showStep('step2');
}

function goToStep1(){
  showStep('step1');
}

function goToStep2(){
  showStep('step2');
}

function getStoredFfUser(){
  try{ return JSON.parse(localStorage.getItem('ffArenaUser') || 'null'); }catch(e){ return null; }
}

function selectMode(index){
  currentModeIndex = index;
  const d = guildI18n[currentGuildLang];

  document.getElementById('step3Heading').textContent = d.modes[index];
  document.getElementById('backBtn3').textContent = d.back;
  document.getElementById('lblUid').textContent = d.lblUid;
  document.getElementById('fieldUid').placeholder = d.uidPlaceholder;
  document.getElementById('lblIdName').textContent = d.lblIdName;
  document.getElementById('fieldIdName').placeholder = d.idNamePlaceholder;
  document.getElementById('lblMobile').textContent = d.lblMobile;
  document.getElementById('fieldMobile').placeholder = d.mobilePlaceholder;
  document.getElementById('lblMsg').textContent = d.lblMsg;
  document.getElementById('fieldMsg').placeholder = d.msgPlaceholder;
  document.getElementById('sendBtn').textContent = d.send;
  document.getElementById('sentMsg').textContent = d.sentMsg;

  // Auto-fill UID / ID Name from the logged-in account, if available.
  const user = getStoredFfUser();
  const uidField = document.getElementById('fieldUid');
  const nameField = document.getElementById('fieldIdName');
  const mobileField = document.getElementById('fieldMobile');
  const note = document.getElementById('autofillNote');
  note.innerHTML = '';

  if(user){
    if(user.uid && !uidField.value) uidField.value = user.uid;
    if(user.name && !nameField.value) nameField.value = user.name;
    if(user.mobile && !mobileField.value) mobileField.value = user.mobile;
    note.innerHTML = d.autofillNote;
  }

  document.getElementById('sentMsg').classList.remove('show');
  document.getElementById('sendBtn').disabled = false;

  showStep('step3');
}

function sendGuildApplication(){
  const btn = document.getElementById('sendBtn');
  const sent = document.getElementById('sentMsg');
  btn.disabled = true;
  sent.classList.add('show');
}

document.addEventListener('DOMContentLoaded', initSlots);
</script>

</body>
</html>
